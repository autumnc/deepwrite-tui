[package]
name = "deepwrite"
version = "0.2.0"
edition = "2021"
description = "A terminal Markdown writing tool with Focus Mode"
license = "MIT"
repository = "https://github.com/tomdhyang/deepwrite-tui"
homepage = "https://github.com/tomdhyang/deepwrite-tui"
readme = "README.md"
keywords = ["markdown", "tui", "editor", "writing", "focus"]
categories = ["command-line-utilities", "text-editors"]
publish = false

[workspace]
members = ["crates/edtui"]
resolver = "2"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
edtui = { path = "crates/edtui", version = "0.11.2", default-features = false, features = ["arboard"] }
arboard = "3"
encoding_rs = "0.8"
chardetng = "0.1"
notify = "7"
regex = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
clap = { version = "4", features = ["derive"] }
ureq = "3"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
